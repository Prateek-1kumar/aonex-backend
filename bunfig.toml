# Bun runtime config — pinned per LLD invariants.
# pg-native excluded (Bun + pg TLS edge case).

[install]
exact = false

[install.scopes]
# (private registry config goes here when we publish @aonex/*)

[test]
# Co-located *.test.ts files. Compiled copies under dist/ are excluded —
# without this, a repo-root `bun test` after `bun run build` re-runs every
# suite from stale build artifacts.
pathIgnorePatterns = ["**/dist/**"]
# preload = []
coverage = false
