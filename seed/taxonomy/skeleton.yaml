# Canonical taxonomy — SKELETON (levels 0-1). Owner-approved 2026-06-10.
# Leaves (levels 2-3) are added in Task 4 (deepen). The loader derives each
# node_id as a slug of the display path, e.g. "Electronics > Mobile Phones &
# Accessories" -> "electronics/mobile-phones-accessories".
version: 0.2-skeleton

# Cross-cutting FACETS — modeled as attributes on products, NOT tree nodes.
# (Decided during skeleton review: these fragment the tree if made categories.)
facets:
  - target_gender   # Male | Female | Unisex (Men's/Women's browse views)
  - age_group       # Adult | Teen | Kids | Baby (Kids/Baby clothing browse views)
  - organic         # boolean, on grocery/beauty
  - luxury          # positioning tier, cross-department
  - subscription    # purchase model (order attribute), not a product category

departments:
  - name: Electronics
    children:
      - Mobile Phones & Accessories
      - Computers & Laptops
      - Tablets & Accessories
      - Smartwatches & Wearables
      - Cameras & Photography
      - Audio & Headphones
      - Video Games & Consoles

  - name: Home & Kitchen
    children:
      - Home Appliances
      - Kitchen Appliances
      - Furniture
      - Home Decor
      - Lighting
      - Bedding & Linen

  - name: Home Improvement & Tools
    children:
      - Home Improvement
      - Tools & Hardware

  - name: Garden & Outdoor
    children: []

  - name: Automotive
    children:
      - Car Parts & Accessories
      - Motorcycle Parts & Accessories
      - Tires & Wheels

  - name: Sports, Fitness & Outdoors
    children:
      - Sports & Fitness
      - Outdoor & Camping
      - Cycling

  - name: Fashion
    children:
      - Clothing             # gender-neutral; target_gender + age_group facets
      - Footwear
      - Bags & Luggage
      - Sunglasses & Eyewear

  - name: Jewelry & Watches
    children:
      - Watches
      - Jewelry

  - name: Beauty & Personal Care
